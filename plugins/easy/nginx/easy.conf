# Easy 简易申请前端
location ^~ /easy {
    alias __PROJECT_ROOT__/plugins/easy/frontend/web;
    index index.html;

    # /easy/invoice 与 /easy/invoice/<tid> / <tid>/<email> 都内部重写到 invoice.html
    # 浏览器地址栏不变，invoice.js 通过 location.pathname 解析 tid / email
    rewrite ^/easy/invoice(/.*)?$ /easy/invoice.html last;

    location ~* \.(?:gif|jpe?g|png|bmp|swf|svg|ico|webp|avif|woff2?|pdf|js|css)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    try_files $uri $uri/ /easy/index.html;
}
