<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简易开票申请</title>
    <link rel="stylesheet" href="/easy/css/style.css?v=1.0.1" />
  </head>
  <body>
    <div id="app">
      <div class="container">
        <!-- 探测失败时显示 -->
        <div id="disabled-card" class="card" style="display: none">
          <div class="card-body">
            <p>开票功能未启用，请联系站点管理员。</p>
          </div>
        </div>

        <!-- Step 1: 输入 tid + email -->
        <div id="step-input" class="step-content card" style="display: none">
          <div class="card-header"><h2>简易开票申请</h2></div>
          <div class="card-body">
            <form id="quota-form">
              <div class="form-group">
                <input type="text" id="tid" placeholder="订单号" required />
              </div>
              <div class="form-group">
                <input type="email" id="email" placeholder="邮箱" required />
              </div>
              <button type="submit" class="btn btn-primary btn-block">
                查询可开金额
              </button>
            </form>
            <p id="quota-error" class="error-message"></p>
          </div>
        </div>

        <!-- Step 2: 显示金额 + 表单 -->
        <div id="step-form" class="step-content card" style="display: none">
          <div class="card-header"><h2>填写发票信息</h2></div>
          <div class="card-body">
            <div class="form-group form-group--info">
              <label>当年已充值</label>
              <div class="form-readonly"><span id="info-recharge"></span> 元</div>
            </div>
            <div class="form-group form-group--info">
              <label>已开金额</label>
              <div class="form-readonly"><span id="info-invoiced"></span> 元</div>
            </div>
            <div class="form-group form-group--info">
              <label>可开金额</label>
              <div class="form-readonly">
                <strong id="info-quota"></strong> 元
              </div>
            </div>
            <p id="quota-empty" class="quota-empty" style="display: none">
              暂无可开额度。可开金额 = 当年充值 - 已开/处理中发票，请先充值后再申请开票。
            </p>
            <form id="apply-form">
              <div class="form-group">
                <label>金额</label>
                <input
                  type="number"
                  step="0.01"
                  min="0.01"
                  id="amount"
                  required
                />
              </div>
              <div class="form-group">
                <label>发票抬头</label>
                <input type="text" id="organization" maxlength="200" required />
              </div>
              <div class="form-group">
                <label>税号</label>
                <input type="text" id="taxation" maxlength="100" required />
              </div>
              <div class="form-group">
                <label>备注（可选）</label>
                <textarea id="remark" maxlength="500"></textarea>
              </div>
              <div class="form-group">
                <label>交付邮箱</label>
                <input type="text" id="delivery-email" readonly />
              </div>
              <button
                id="apply-submit"
                type="submit"
                class="btn btn-primary btn-block"
              >
                提交开票申请
              </button>
            </form>
            <p id="apply-error" class="error-message"></p>
          </div>
        </div>

        <!-- Step 3: 成功 -->
        <div id="step-done" class="step-content card" style="display: none">
          <div class="card-body">
            <p>
              申请已提交，开票后将通过邮件发送至
              <strong id="done-email"></strong>
            </p>
          </div>
        </div>
      </div>
    </div>
    <script src="/easy/js/invoice.js?v=1.0.0"></script>
  </body>
</html>
