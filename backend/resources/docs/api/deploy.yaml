openapi: 3.1.0
info:
  title: 部署接口
  version: "1.0"
  description: |
    供自动化部署工具（certimate 等）拉取证书、触发续费/重签、回报部署结果。

    - **鉴权**：请求头 `Authorization: Bearer {部署 Token}`（在「设置 → 部署」获取；亦支持 `?token=`）。
    - **统一响应**：`{ "code": 1|0, "msg": "", "data": {...} }`；`field` 取 PEM 时直接返回纯文本。

servers:
  - url: /api/deploy
    description: 当前站点

security:
  - bearerAuth: []

paths:
  /:
    get:
      summary: 查询订单 / 拉取 PEM
      description: |
        `order` **必填**。不带 `field` 时只接受订单 ID：单个，或英文逗号分隔的多个（上限 100）；
        其他形态（域名、空值）返回 `code=0` + `errors.error_code=invalid_order`。
        批量只返回命中的订单，部分不存在不报错；响应**不分页**（条数恒 ≤100）。
        `field=certificate|private_key` 时 `order` 须为单个 ID 或单个域名（按 `common_name` 精确匹配
        取最新 active 证书），**直接返回纯 PEM 文本**
        （certificate 含中间证书；重签后 ID 不变，续费返回新 ID）。
      parameters:
        - {
            name: order,
            in: query,
            required: true,
            schema: { type: string },
            description: 订单 ID 或逗号分隔批量（≤100）；带 field 时亦可为单个域名
          }
        - name: field
          in: query
          required: false
          schema: { type: string, enum: [certificate, private_key] }
          description: 指定则返回纯 PEM 文本
      responses:
        "200":
          description: 不带 field 返回 JSON 订单列表；带 field 返回纯 PEM 文本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          renew_before_days: { type: integer }
                          data:
                            type: array
                            items: { $ref: "#/components/schemas/DeployOrder" }
            text/plain:
              schema: { type: string, description: 纯 PEM（field 模式） }

    post:
      summary: 更新
      description: |
        按订单当前状态推进：`unpaid`→支付、`pending`→提交、
        `active`→到期 ≤15 天续费（需开启自动续费）、否则重签。
        注意：`unpaid`/`pending`（签发进行中）状态下携带非空 `csr` 或 `domains`
        将返回错误（code=0）——在途订单的 CSR/域名已定型无法变更；
        仅传 `order_id` 可正常推进（支付/提交）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: { type: integer }
                csr: { type: string, description: 不传则系统生成 }
                domains:
                  { type: string, description: 逗号分隔；不传沿用当前证书域名 }
                validation_method:
                  type: string
                  enum: [delegation, file]
                  description: 默认 delegation；file 按产品回落 file→https→http
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/DeployOrder"
                          - type: object
                            properties:
                              renew_before_days: { type: integer }

  /callback:
    post:
      summary: 回报部署结果
      description: |
        **仅回报部署结果**：每次部署成功或部署失败都会独立记录状态、来源 IP 与上报时间（成功上报同时记录
        部署时间），逐条入自动部署上报记录表（`auto_deploy_reports`），记录层不做任何抑制。
        **签发失败不由此上报**——签发/自动重签失败由服务端自行记录（本地 CSR 提交后的服务端处理失败、
        服务端自动重签失败均由服务端自写记录行，来源 IP 留空，与部署失败的失败说明天然可辨），客户端零参与。

        **通知消噪（不影响响应）**：任一失败记录（部署回调失败或服务端自写签发失败）触发一封运维告警，
        按订单固定指纹去重——去重期（默认 7 天）内同一订单重复失败只入表不再通知，去重期到期仍未解决再
        提醒一封；部署成功即解除该订单的去重，复发时立即再告警。服务端自动重签成功且此前有失败在案时，
        服务端同样自写一行恢复记录（来源 IP 留空）并解除去重。这些均为服务端旁路行为，回调请求/响应零改动。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, status]
              properties:
                order_id: { type: integer }
                status: { type: string, enum: [success, failure] }
                deployed_at: { type: string, description: 可选，部署完成时间 }
                message:
                  type: string
                  maxLength: 500
                  description: 可选，部署失败原因说明（前向兼容扩展，下游后续版本可选上送；服务端转义并截断后记录）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          order_id: { type: integer }
                          status: { type: string }
                          recorded:
                            {
                              type: boolean,
                              description: 上报记录是否已保存；成功响应固定为 true
                            }
                          renew_before_days: { type: integer }

  /auto-reissue:
    post:
      summary: 开关订单自动重签
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, auto_reissue]
              properties:
                order_id: { type: integer }
                auto_reissue: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          order_id: { type: integer }
                          auto_reissue: { type: boolean }

  /acme/new:
    post:
      summary: 创建 ACME 订阅
      description: 一步到位（创建 + 支付 + 提交），返回含 EAB + directory_url。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_code, contact_email]
              properties:
                product_code: { type: string, maxLength: 50 }
                contact_email: { type: string, format: email, maxLength: 254 }
                period: { type: integer }
                plus: { type: integer, enum: [0, 1] }
                refer_id: { type: string, maxLength: 64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AcmeSubscription" }

  /acme/{id}:
    get:
      summary: ACME 订阅详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AcmeSubscription" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 部署 Token（在「设置 → 部署」获取；亦支持 ?token=）

  schemas:
    ApiResponse:
      type: object
      properties:
        code: { type: integer, enum: [0, 1] }
        msg: { type: string }
        data: {}
        errors:
          type: object
          description: |
            仅失败（`code=0`）时出现，**有三种形态**：

            1. `{error_code, retry_after?}` —— 机器可读的失败分类（下表枚举）。
            2. `{字段名: [消息, ...]}` —— 参数校验失败袋，例
               `{"order":["The order field must be a string."]}`，**不含** `error_code`。
            3. 不出现 —— 订单服务层透传的业务错误（例 `msg="产品配置错误"`），服务端目前不分类。

            失败一律 HTTP 200，故 `error_code` 是区分「确定性失败」与网络错误的唯一依据：
            带 `error_code` 的失败不应重试，需换 token / 放开 IP / 改参数 / 充值；形态 2、3
            按未分类处理，沿用既有重试策略。**判定必须看 `errors.error_code` 是否非空，
            不能看「有没有 errors 键」**——形态 2 有键却不是分类标识。
            `error_code` 取值一旦发布不再改动，只会新增。
          properties:
            error_code:
              type: string
              enum:
                [
                  rate_limited,
                  token_missing,
                  token_invalid,
                  token_disabled,
                  account_disabled,
                  ip_not_allowed,
                  invalid_order,
                  order_not_found,
                  cert_not_found,
                  order_in_progress,
                  validation_method_unsupported,
                  auto_renew_disabled,
                  insufficient_balance
                ]
            retry_after:
              type: integer
              description: |
                仅 `rate_limited` 时出现，**睡满即可重试的保守秒数**（HTTP `Retry-After` 语义）。
                因限流用滑动窗口加权判定，该值会跨过下一个整窗口（`2×窗口 - 已过秒数`），
                只睡到下一窗口起点是不够的。前提是这段时间内不再发请求：期间继续打会重新累积计数。
                客户端也可以直接本轮停止、等下个调度周期，不必真的 sleep。
          additionalProperties: true

    DeployOrder:
      type: object
      properties:
        order_id: { type: integer }
        domains: { type: string }
        status: { type: string }
        certificate: { type: string, description: active 时返回 }
        private_key: { type: string, description: active 时返回 }
        ca_certificate: { type: string, description: active 时返回（中间证书） }
        issued_at: { type: [string, "null"] }
        expires_at: { type: [string, "null"] }
        file:
          type: object
          description: processing 且文件验证时返回
          properties:
            path: { type: string }
            content: { type: string }

    AcmeSubscription:
      type: object
      description: ACME 订阅记录（含 EAB 与 directory_url）；已隐藏 user_id/plus/api_id 等内部字段
      properties:
        id: { type: integer }
        product: { type: [object, "null"], description: 关联产品 }
        brand: { type: string }
        period: { type: integer, description: 周期（月） }
        purchased_standard_count: { type: integer, description: 标准域名额度 }
        purchased_wildcard_count: { type: integer, description: 通配符域名额度 }
        contact_email: { type: string }
        eab_kid: { type: string }
        eab_hmac: { type: string }
        directory_url: { type: string }
        vendor_id: { type: [string, "null"] }
        refer_id: { type: [string, "null"] }
        period_from: { type: [string, "null"] }
        period_till: { type: [string, "null"] }
        cancelled_at: { type: [string, "null"] }
        status: { type: string }
