openapi: 3.1.0
info:
  title: 部署接口
  version: "1.0"
  description: |
    供自动化部署工具（certimate 等）拉取证书、触发续费/重签、回报部署结果。

    - **鉴权**：请求头 `Authorization: Bearer {部署 Token}`；URL 拉取场景（`field=`，如 certimate 填死 URL）带不了请求头，可用 `?token=`。
    - **统一响应**：`{ "code": 1|0, "msg": "", "data": {...} }`；`field` 取 PEM 时直接返回纯文本。

servers:
  - url: /api/deploy
    description: 当前站点

security:
  - bearerAuth: []

paths:
  /:
    get:
      summary: 查询订单 / 拉取 PEM
      description: |
        查询订单状态与证书内容，单次取完不分页；带 `field` 时改为直接返回纯 PEM 文本
        （`certificate` 含中间证书）。重签后订单 ID 不变，续费返回新 ID。
      parameters:
        - {
            name: order,
            in: query,
            required: true,
            schema: { type: string },
            description: 订单 ID 或逗号分隔批量（≤100）；带 field 时亦可为单个域名
          }
        - name: field
          in: query
          required: false
          schema: { type: string, enum: [certificate, private_key] }
          description: 指定则返回纯 PEM 文本
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          renew_before_days: { type: integer }
                          data:
                            type: array
                            items: { $ref: "#/components/schemas/DeployOrder" }
            text/plain:
              schema: { type: string, description: 纯 PEM（field 模式） }

    post:
      summary: 更新
      description: |
        按订单当前状态推进：`unpaid`→支付、`pending`→提交、
        `active`→到期 ≤15 天续费（需开启自动续费）、否则重签。
        只有 `active` 接受 `csr`/`domains`：在途（`unpaid`/`pending`/`processing`/`approving`）报
        `order_in_progress`，`cancelling` 与终态报 `order_not_active`；两者都不静默丢弃后返回成功。
        携带 `csr` 的**重签**有 15 天冷却（续费不受限）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: { type: integer }
                csr: { type: string, description: 不传则系统生成 }
                domains:
                  { type: string, description: 逗号分隔；不传沿用当前证书域名 }
                validation_method:
                  type: string
                  enum: [delegation, file]
                  description: 默认 delegation；file 按产品回落 file→https→http
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/DeployOrder"
                          - type: object
                            properties:
                              renew_before_days: { type: integer }

  /callback:
    post:
      summary: 回报部署结果
      description: |
        **仅回报部署结果**：每次部署成功或失败各上报一次，逐条独立记录，不做筛选或节流。
        签发失败不由此上报，服务端自行记录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, status]
              properties:
                order_id: { type: integer }
                status: { type: string, enum: [success, failure] }
                deployed_at: { type: string, description: 可选，部署完成时间 }
                message:
                  type: string
                  maxLength: 500
                  description: 可选，部署失败原因说明
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          order_id: { type: integer }
                          status: { type: string }
                          recorded: { type: boolean, description: 上报记录是否已保存 }
                          renew_before_days: { type: integer }

  /auto-reissue:
    post:
      summary: 开关订单自动重签
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, auto_reissue]
              properties:
                order_id: { type: integer }
                auto_reissue: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          order_id: { type: integer }
                          auto_reissue: { type: boolean }

  /acme/new:
    post:
      summary: 创建 ACME 订阅
      description: 一步到位（创建 + 支付 + 提交），返回含 EAB + directory_url。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_code, contact_email]
              properties:
                product_code: { type: string, maxLength: 50 }
                contact_email: { type: string, format: email, maxLength: 254 }
                period: { type: integer }
                plus: { type: integer, enum: [0, 1] }
                refer_id: { type: string, maxLength: 64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AcmeSubscription" }

  /acme/{id}:
    get:
      summary: ACME 订阅详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data: { $ref: "#/components/schemas/AcmeSubscription" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 部署 Token（在「设置 → 部署」获取；亦支持 ?token=）

  schemas:
    ApiResponse:
      type: object
      properties:
        code: { type: integer, enum: [0, 1] }
        msg: { type: string }
        data: {}
        errors:
          type: object
          description: |
            仅失败（`code=0`）时出现，三种形态：`{error_code, retry_after?}` 失败分类；
            `{字段名: [消息, ...]}` 参数校验失败袋（**不含** `error_code`）；不出现（服务层透传的业务错误）。

            失败一律 HTTP 200，故 `error_code` 是区分确定性失败与网络错误的唯一依据，
            带它的失败不应重试（需换 token / 放开 IP / 改参数 / 充值）。
            **判定看 `errors.error_code` 是否非空，不能看有没有 `errors` 键**——校验失败袋也有该键。
            取值一旦发布不再改动，只会新增。
          properties:
            error_code:
              type: string
              enum:
                [
                  rate_limited,
                  token_missing,
                  token_invalid,
                  token_disabled,
                  account_disabled,
                  ip_not_allowed,
                  invalid_order,
                  order_not_found,
                  cert_not_found,
                  order_in_progress,
                  order_not_active,
                  validation_method_unsupported,
                  auto_renew_disabled,
                  insufficient_balance
                ]
            retry_after:
              type: integer
              description: |
                仅 `rate_limited` 时出现，**睡满即可重试的秒数**（HTTP `Retry-After` 语义）；
                期间继续发请求会重新累积计数。
          additionalProperties: true

    DeployOrder:
      type: object
      properties:
        order_id: { type: integer }
        domains: { type: string }
        status: { type: string }
        csr: { type: string, description: 当前签发动作的 CSR；无则为空串 }
        certificate: { type: string, description: active 时返回 }
        private_key: { type: string, description: active 时返回 }
        ca_certificate: { type: string, description: active 时返回（中间证书） }
        issued_at: { type: [string, "null"] }
        expires_at: { type: [string, "null"] }
        file:
          type: object
          description: processing 且文件验证时返回
          properties:
            path: { type: string }
            content: { type: string }

    AcmeSubscription:
      type: object
      description: ACME 订阅记录（含 EAB 与 directory_url）
      properties:
        id: { type: integer }
        product: { type: [object, "null"], description: 关联产品 }
        brand: { type: string }
        period: { type: integer, description: 周期（月） }
        purchased_standard_count: { type: integer, description: 标准域名额度 }
        purchased_wildcard_count: { type: integer, description: 通配符域名额度 }
        contact_email: { type: string }
        eab_kid: { type: string }
        eab_hmac: { type: string }
        directory_url: { type: string }
        vendor_id: { type: [string, "null"] }
        refer_id: { type: [string, "null"] }
        period_from: { type: [string, "null"] }
        period_till: { type: [string, "null"] }
        cancelled_at: { type: [string, "null"] }
        status: { type: string }
