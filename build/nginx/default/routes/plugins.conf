# 插件静态资源(^~ 前缀匹配,优先级高于 BT 面板的正则规则)
location ^~ /plugins/ {
    root __PROJECT_ROOT__;
    location ~* ^/plugins/[^/]+/frontend/(admin|user)/[^/]+\.(js|css)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    return 404;
}
