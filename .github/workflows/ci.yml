        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, redis, zip, gd, bcmath
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Composer Cache Directory
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy .env (mysql)
        working-directory: backend
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=ssl_manager_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=password/' .env
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/DB_COLLATION=.*/DB_COLLATION=${{ matrix.collation }}/' .env

      - name: Generate keys
        working-directory: backend
        run: |
          php artisan key:generate
          php artisan jwt:secret --force

      - name: Run migrations
        working-directory: backend
        run: php artisan migrate --force

      - name: Run snapshot compare
        working-directory: backend
        run: composer test:snapshot

      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diff-report
          path: backend/tests/Compat/diff-report.md
          if-no-files-found: ignore

  # 后端静态检查：pint / phpstan / 反模式零容忍 grep / review-checklist staleness
  # 均无 DB 依赖，单 PHP 8.4 即可（pint/phpstan 与 MySQL 版本无关）。
  # fail-closed：finish-check-greps.sh 必须存在，缺失即红，不加存在性守卫。
  backend-static:
    name: Backend Static Checks (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Agent config drift check
        run: make check-agent-config

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, redis, zip, gd, bcmath
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Composer Cache Directory
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Pint (format check)
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: PHPStan (level 5)
        working-directory: backend
        run: ./vendor/bin/phpstan analyse --level=5 --memory-limit=2G

      - name: 反模式零容忍 grep
        run: bash skills/scripts/finish-check-greps.sh

      - name: review-checklist staleness 检查
        run: bash skills/scripts/check-review-checklist-staleness.sh

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # shared 对称副本等价夹具等测试（反模式 4 配套；与 backend PlatformConfigServiceTest 共享夹具）
      - name: Shared unit tests
        run: pnpm test:shared

      - name: Build admin
        run: pnpm build:admin

      - name: Build user
        run: pnpm build:user

      - name: Build plugins
        # 插件前端产物不入库（方案 B），CI 现构建以验证各插件可编译、防 src 漂移无人发现
        run: make plugins-build

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # check 变体（prettier --check / eslint 无 --fix / stylelint 无 --fix）：
      # 本地 pnpm lint 保持 fixer；CI 跑 lint:check 才是真门禁（--write/--fix 永远 exit 0）。
      - name: Run lint checks
        run: pnpm lint:check

  deploy-shell-tests:
    name: Deploy Shell Tests
    runs-on: ubuntu-latest
    # 强制执行 deploy 脚本的跨实现/对称副本等价测试（反模式 4 配套）：
    # 此前 test-version-gt.sh 已存在却未接入 CI，对称副本无任何自动校验。
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: version_gt bash↔PHP 等价
        run: bash deploy/test/test-version-gt.sh

      - name: 对称副本字节等价 + redis 解析 bash↔PHP 等价
        run: bash deploy/test/test-symmetric-copies.sh

      - name: 安装与升级包单次下载超时下限
        run: bash deploy/test/test-package-download-timeouts.sh

      - name: upgrade storage 防删守卫 + 信号还原演练（验收⑦）
        run: bash deploy/test/test-upgrade-preserve-guard.sh

      - name: 发布包内容审计正反例
        run: bash build/tests/package-audit-test.sh

      - name: 构建产物运行数据隔离
        run: bash build/tests/collect-artifacts-test.sh

      - name: 前端依赖变更使构建缓存失效
        run: bash build/tests/build-frontend-cache-test.sh

      - name: upgrade cron 管理段（M3/M6 §1.5）mock 演练
        run: bash deploy/test/test-cron-manage.sh

      - name: upgrade queue worker 状态检测演练
        run: bash deploy/test/test-queue-worker-status.sh

      - name: upgrade PHP-FPM 单次重载与动态等待演练
        run: bash deploy/test/test-php-fpm-reload.sh

      - name: upgrade 入口残留升级状态处置演练
        run: bash deploy/test/test-upgrade-stale-status.sh
