name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 并发控制：同一 tag 只允许一个 release 流程
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Get version info
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 判断是否为开发版
          if [[ "$TAG" == *"-dev"* ]] || [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "channel=dev" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "channel=main" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, redis, zip, gd, bcmath
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Get Composer Cache Directory
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-dev --optimize-autoloader --no-interaction

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin frontend
        run: pnpm build:admin

      - name: Build user frontend
        run: pnpm build:user

      - name: Collect and package release artifacts
        env:
          BUILD_BACKEND: 'true'
          BUILD_ADMIN: 'true'
          BUILD_USER: 'true'
          BUILD_NGINX: 'true'
          BUILD_WEB: 'true'
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
          CONFIG_FILE: ${{ github.workspace }}/build/config.json
          SOURCE_DIR: ${{ github.workspace }}
          WORKSPACE_DIR: ${{ github.workspace }}
          PRODUCTION_DIR: ${{ github.workspace }}/build/temp/production-code
          BUILD_ASSETS_DIR: ${{ github.workspace }}/build
        run: |
          ./build/scripts/collect-artifacts.sh
          ./build/scripts/package.sh \
            --version "${{ steps.version.outputs.version }}" \
            --channel "${{ steps.version.outputs.channel }}" \
            --source "$PRODUCTION_DIR" \
            --output "$GITHUB_WORKSPACE/release"

      - name: Calculate checksums
        run: |
          cd release
          sha256sum ssl-manager-*.zip > checksums.txt
          cat checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-packages
          path: |
            release/ssl-manager-*.zip
            release/checksums.txt

      - name: Delete existing release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting existing release: $TAG"
            gh release delete "$TAG" --yes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release/ssl-manager-full-${{ steps.version.outputs.version }}.zip
            release/ssl-manager-upgrade-${{ steps.version.outputs.version }}.zip
            release/ssl-manager-script-${{ steps.version.outputs.version }}.zip
            release/checksums.txt
          body: |
            ## SSL Manager ${{ steps.version.outputs.version }}

            ### 下载

            | 包类型 | 说明 |
            |--------|------|
            | `ssl-manager-full-*.zip` | 完整安装包 |
            | `ssl-manager-upgrade-*.zip` | 升级包 |
            | `ssl-manager-script-*.zip` | 脚本部署包 |

            ### 校验和

            见 `checksums.txt` 文件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest packages (stable)
        if: steps.version.outputs.prerelease != 'true'
        run: |
          cd release
          cp ssl-manager-full-${{ steps.version.outputs.version }}.zip ssl-manager-full-latest.zip
          cp ssl-manager-script-${{ steps.version.outputs.version }}.zip ssl-manager-script-latest.zip

      - name: Delete existing latest release
        if: steps.version.outputs.prerelease != 'true'
        run: |
          gh release delete "latest" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest tag (stable)
        if: steps.version.outputs.prerelease != 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          git tag latest
          git push origin latest

      - name: Update latest release (stable)
        if: steps.version.outputs.prerelease != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Stable Release (${{ steps.version.outputs.version }})
          prerelease: false
          files: |
            release/ssl-manager-full-latest.zip
            release/ssl-manager-script-latest.zip
          body: |
            ## Latest Stable Release

            当前最新稳定版本: **${{ steps.version.outputs.version }}**

            ### 下载

            | 包类型 | 说明 |
            |--------|------|
            | `ssl-manager-full-latest.zip` | 完整安装包 |
            | `ssl-manager-script-latest.zip` | 脚本部署包 |

            ---
            查看完整版本列表请访问 [Releases](https://github.com/zhuxbo/ssl-manager/releases)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
